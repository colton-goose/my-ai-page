const BUCKETS = ["Winner","Potential - Watch","Potential - Low Signal","Drain","Branded","Competitor","Service Mismatch","Geographic Mismatch","Junk/Toss","Unassigned"];

  "Winner":"Relevant, converting (1+ conv), CPA within target. Push to exact match.",
  "Potential - Watch":"Relevant, practice-specific intent, has data but not yet converting. Monitor closely.",
  "Potential - Low Signal":"Relevant but generic, no practice-specific modifiers, or insufficient data. Needs runway.",
  "Drain":"Relevant intent, 10+ clicks, zero conversions. Actively wasting spend. Pause or negate.",
  "Branded":"Own firm name/variants. Route to brand campaign only.",
  "Competitor":"Another firm's name or brand. Route to competitor campaign only.",
  "Service Mismatch":"Legal intent but wrong practice focus for this ad group.",

  "Junk/Toss":"Irrelevant, informational, no commercial intent.",
  "Unassigned":"Not yet scored.",
};

const CONTINGENCY_FRIENDLY = ["Personal Injury","Workers Comp","Medical Malpractice","Social Security/Disability"];

const PRO_BONO_PATTERNS = ["pro bono","probono","free legal work","free representation","free legal aid","free legal help","free legal assistance","volunteer lawyer","volunteer attorney"];
const FREE_CONSULT_PATTERNS = ["free consult","free consultation","free case review","free case evaluation","no cost consult","no cost consultation","free legal consult","free legal consultation"];
const CONTINGENCY_PATTERNS = ["free case","no cost lawyer","no cost attorney","no win no fee","no fee unless","contingency fee","no upfront","pay nothing unless","only pay if","free legal","no cost legal"];

const termMatchesPatterns=(term,patterns)=>patterns.some(p=>term.toLowerCase().includes(p));

const preScreen=(term, noFreeConsult, practiceArea)=>{
  if(termMatchesPatterns(term,PRO_BONO_PATTERNS)) return "Junk/Toss";
  if(noFreeConsult&&termMatchesPatterns(term,FREE_CONSULT_PATTERNS)) return "Junk/Toss";
  const isContingencyFriendly = CONTINGENCY_FRIENDLY.includes(practiceArea);
  if(noFreeConsult && !isContingencyFriendly && termMatchesPatterns(term,CONTINGENCY_PATTERNS)) return "Junk/Toss";
  return null;
};

const emptyTerm=()=>({id:crypto.randomUUID(),term:"",campaign:"",adGroup:"",clicks:"",impressions:"",cost:"",conversions:"",ctr:"",roas:"",cpa:"",bucket:"Unassigned",practiceArea:"",practiceFocus:"",scoreReason:"",confidence:"",flagClone:false,flagBidUp:false,flagPushExact:false});
const mkClient=(name,practiceAreas=[],noFreeConsult=false,targetCPA=200,serviceArea="")=>({id:crypto.randomUUID(),name,practiceAreas,noFreeConsult,targetCPA,serviceArea,adGroupMap:{},terms:[]});
const adGroupKey=(campaign,adGroup)=>`${campaign}||${adGroup}`;

const parseTSV=(raw)=>{
  const lines=raw.trim().split("\n").filter(l=>l.trim());
  if(!lines.length) return [];
  const headers=lines[0].split("\t").map(h=>h.trim().toLowerCase().replace(/[^a-z0-9]/g,""));
  const map={term:["searchterm","keyword","term","kw","query"],campaign:["campaign","campaignname","camp"],adGroup:["adgroup","adgroupname","group"],clicks:["clicks","click"],impressions:["impressions","impr","imps"],cost:["cost","spend"],conversions:["conversions","conv","convs"],ctr:["ctr"],roas:["roas"],cpa:["cpa","costperconv"]};
  const idx={};
  Object.entries(map).forEach(([field,aliases])=>{const i=headers.findIndex(h=>aliases.includes(h));if(i>=0) idx[field]=i;});
  return lines.slice(1).map(line=>{const cols=line.split("\t");const t=emptyTerm();Object.entries(idx).forEach(([field,i])=>{if(cols[i]!==undefined) t[field]=cols[i].trim();});return t;}).filter(t=>t.term);
};

const fmt=(v,type)=>{
  if(v===""||v===null||v===undefined) return "-";
  const n=parseFloat(String(v).replace(/[$,%]/g,""));
  if(isNaN(n)) return v;
  if(type==="currency") return "$"+n.toFixed(2);
  if(type==="pct") return (n<1?(n*100).toFixed(1):n.toFixed(1))+"%";
  if(type==="roas") return n.toFixed(2)+"x";
  if(type==="num") return Math.round(n).toLocaleString();
  return v;
};
const formatKw=(term,type)=>{if(type==="Exact") return `[${term}]`;if(type==="Phrase") return `"${term}"`;return term;};
const CONFIDENCE_COLORS={"High":"text-emerald-400","Medium":"text-yellow-400","Low":"text-red-400","":"text-gray-600"};
const CHUNK_SIZE=25;

async function scoreChunk(terms, practiceArea, practiceFocus, firmName, targetCPA, serviceArea){
  const termList=terms.map((t,i)=>{
    const conv=parseFloat(t.conversions)||0;const cost=parseFloat(String(t.cost).replace(/[$,]/g,""))||0;const clicks=parseFloat(t.clicks)||0;const impr=parseFloat(t.impressions)||0;const cpa=conv>0?"$"+(cost/conv).toFixed(2):"N/A";
    return `${i+1}. Term: "${t.term}" | Campaign: "${t.campaign||"Unknown"}" | Ad Group: "${t.adGroup||"Unknown"}" | Clicks: ${clicks} | Impressions: ${impr} | Conversions: ${conv} | CPA: ${cpa} | Target CPA: $${targetCPA}`;
  }).join("\n");
  const geoInstructions=serviceArea?`Service Area: ${serviceArea}\nGeographic scoring rules:\n- If the term contains a location signal that MATCHES the service area: score on relevance as normal.\n- If the term contains a location signal that DOES NOT match the service area: classify as "Geographic Mismatch".\n- If the term contains "near me", "nearby", "local", or no location signal: ignore geography and score on practice relevance only.`:`No service area defined. Ignore geography in scoring.`;
  const prompt=`You are a senior Google Ads expert specializing in legal PPC. You are auditing search terms for a law firm${firmName?` called "${firmName}"`:""}.\n\nPractice Area: ${practiceArea}\nPractice Focus: ${practiceFocus}\n\n${geoInstructions}\n\nBUCKET DEFINITIONS:\n- Winner: Directly relevant to "${practiceFocus}", strong commercial intent, practice-specific legal noun present, converting well.\n- Potential - Watch: Relevant to "${practiceFocus}" AND contains at least one practice-specific noun OR a strong commercial modifier.\n- Potential - Low Signal: Topically related but GENERIC - no legal service noun, no commercial modifier, or purely informational.\n- Drain: Relevant or semi-relevant, spending with zero conversions after meaningful click volume.\n- Branded: Contains the firm's own name or clear brand variants.\n- Competitor: Contains another law firm's name or brand.\n- Service Mismatch: Has legal intent but clearly belongs to a DIFFERENT practice focus than "${practiceFocus}".\n- Geographic Mismatch: Correct practice intent but contains a location that does NOT match the service area.\n- Junk/Toss: Irrelevant, purely informational, no commercial intent.\n\nTerms:\n${termList}\n\nRespond with ONLY a JSON array, one object per term:\n[{"bucket":"Potential - Watch","confidence":"High","reason":"DUI attorney with near me modifier, clear commercial intent"},...]\n\nNo explanation, no markdown, just the raw JSON array.`;
  const response=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content:prompt}]})});
  const data=await response.json();
  const text=data.content?.find(b=>b.type==="text")?.text||"[]";
  try{return JSON.parse(text.replace(/```json|```/g,"").trim());}
  catch{return terms.map(()=>({bucket:"Potential - Low Signal",confidence:"Low",reason:"Parse error, defaulted"}));}
}

function PracticeFocusSelect({value,onChange,placeholder="Select focus",className=""}){
  return(<select value={value} onChange={e=>onChange(e.target.value)} className={`bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs text-white ${className}`}><option value="">{placeholder}</option>{Object.entries(PRACTICE_TAXONOMY).map(([area,focuses])=>(<optgroup key={area} label={area}>{focuses.map(f=><option key={f} value={`${area}||${f}`}>{f}</option>)}</optgroup>))}</select>);
}

export default function App(){
  const [clients,setClients]=useState([mkClient("Client 1",[],false,200,"")]);
  const [activeClientId,setActiveClientId]=useState(()=>clients[0].id);
  const [showClientModal,setShowClientModal]=useState(false);
  const [newClientName,setNewClientName]=useState("");
  const [newClientAreas,setNewClientAreas]=useState([]);
  const [newClientNoFreeConsult,setNewClientNoFreeConsult]=useState(false);
  const [newClientTargetCPA,setNewClientTargetCPA]=useState(200);
  const [newClientServiceArea,setNewClientServiceArea]=useState("");
  const [renamingId,setRenamingId]=useState(null);
  const [renameVal,setRenameVal]=useState("");
  const [showAdGroupMap,setShowAdGroupMap]=useState(false);
  const [pendingTerms,setPendingTerms]=useState([]);
  const [adGroupDraft,setAdGroupDraft]=useState({});
  const [selected,setSelected]=useState(new Set());
  const [filterBucket,setFilterBucket]=useState("All");
  const [filterArea,setFilterArea]=useState("All");
  const [filterFocus,setFilterFocus]=useState("All");
  const [filterCampaign,setFilterCampaign]=useState("All");
  const [filterAdGroup,setFilterAdGroup]=useState("All");
  const [filterSearch,setFilterSearch]=useState("");
  const [sortCol,setSortCol]=useState("term");
  const [sortDir,setSortDir]=useState("asc");
  const [tab,setTab]=useState("table");
  const [pasteRaw,setPasteRaw]=useState("");
  const [pasteError,setPasteError]=useState("");
  const [showAddRow,setShowAddRow]=useState(false);
  const [newRow,setNewRow]=useState(emptyTerm());
  const [exportMatchType,setExportMatchType]=useState("Exact");
  const [exportBuckets,setExportBuckets]=useState(["Junk/Toss","Drain","Service Mismatch","Competitor","Geographic Mismatch"]);
  const [exportGroupBy,setExportGroupBy]=useState("adGroup");
  const [exportCampaign,setExportCampaign]=useState("All");
  const [bulkBucket,setBulkBucket]=useState("Junk/Toss");
  const [bulkFocus,setBulkFocus]=useState("");
  const [copied,setCopied]=useState(false);
  const [scoring,setScoring]=useState(false);
  const [scoringTermId,setScoringTermId]=useState(null);
  const [scoreProgress,setScoreProgress]=useState({done:0,total:0});
  const [scoreError,setScoreError]=useState("");
  const [tooltip,setTooltip]=useState({visible:false,text:"",x:0,y:0});

  const activeClient=clients.find(c=>c.id===activeClientId)||clients[0];
  const terms=activeClient.terms;
  const setTerms=(updater)=>setClients(prev=>prev.map(c=>c.id===activeClientId?{...c,terms:typeof updater==="function"?updater(c.terms):updater}:c));
  const updateClient=(id,fields)=>setClients(prev=>prev.map(c=>c.id===id?{...c,...fields}:c));

  const applyPostScoreLogic=(t,bucket,activeClient)=>{
    const clicks=parseFloat(t.clicks)||0;const impressions=parseFloat(t.impressions)||0;const conv=parseFloat(t.conversions)||0;const cost=parseFloat(String(t.cost).replace(/[$,]/g,""))||0;const cpa=conv>0?cost/conv:Infinity;const hasMinData=clicks>=10&&impressions>=10;
    if(["Geographic Mismatch","Branded","Competitor","Service Mismatch","Junk/Toss"].includes(bucket)) return bucket;
    if(!hasMinData&&["Winner","Drain"].includes(bucket)) bucket="Potential - Low Signal";
    if(bucket==="Winner"&&(conv<1||cpa>activeClient.targetCPA)) bucket="Potential - Watch";
    if(bucket==="Potential - Watch"&&hasMinData&&clicks>=10&&conv===0) bucket="Drain";
    return bucket;
  };

  const switchClient=(id)=>{setActiveClientId(id);setSelected(new Set());setFilterBucket("All");setFilterCampaign("All");setFilterAdGroup("All");setFilterArea("All");setFilterFocus("All");setFilterSearch("");setTab("table");};
  const addClient=()=>{if(!newClientName.trim()) return;const c=mkClient(newClientName.trim(),newClientAreas,newClientNoFreeConsult,newClientTargetCPA,newClientServiceArea);setClients(prev=>[...prev,c]);setActiveClientId(c.id);setNewClientName("");setNewClientAreas([]);setNewClientNoFreeConsult(false);setNewClientTargetCPA(200);setNewClientServiceArea("");setShowClientModal(false);setSelected(new Set());setTab("table");};
  const deleteClient=(id)=>{if(clients.length===1) return;const remaining=clients.filter(c=>c.id!==id);setClients(remaining);if(activeClientId===id){setActiveClientId(remaining[0].id);setSelected(new Set());}};
  const renameClient=(id)=>{if(!renameVal.trim()){setRenamingId(null);return;}setClients(prev=>prev.map(c=>c.id===id?{...c,name:renameVal.trim()}:c));setRenamingId(null);};
  const clearClientTerms=(id)=>{setClients(prev=>prev.map(c=>c.id===id?{...c,terms:[],adGroupMap:{}}:c));if(id===activeClientId) setSelected(new Set());};
  const updateTerm=(id,field,val)=>setTerms(prev=>prev.map(t=>t.id===id?{...t,[field]:val}:t));
  const deleteTerm=(id)=>{setTerms(prev=>prev.filter(t=>t.id!==id));setSelected(prev=>{const s=new Set(prev);s.delete(id);return s;});};

  const handlePaste=()=>{const parsed=parseTSV(pasteRaw);if(!parsed.length){setPasteError("No valid data found.");return;}const uniqueAGs={};parsed.forEach(t=>{const key=adGroupKey(t.campaign,t.adGroup);if(!uniqueAGs[key]) uniqueAGs[key]={campaign:t.campaign,adGroup:t.adGroup,key};});const draft={};Object.keys(uniqueAGs).forEach(key=>{const existing=activeClient.adGroupMap[key];draft[key]=existing?`${existing.practiceArea}||${existing.practiceFocus}`:"";});setPendingTerms(parsed);setAdGroupDraft(draft);setShowAdGroupMap(true);setPasteRaw("");setPasteError("");};

  const confirmAdGroupMap=()=>{const newMap={...activeClient.adGroupMap};Object.entries(adGroupDraft).forEach(([key,val])=>{if(val){const[area,focus]=val.split("||");newMap[key]={practiceArea:area,practiceFocus:focus};}});const tagged=pendingTerms.map(t=>{const key=adGroupKey(t.campaign,t.adGroup);const mapping=newMap[key]||{practiceArea:activeClient.practiceAreas[0]||"",practiceFocus:""};return{...t,practiceArea:mapping.practiceArea,practiceFocus:mapping.practiceFocus};});setClients(prev=>prev.map(c=>c.id===activeClientId?{...c,adGroupMap:newMap,terms:[...c.terms,...tagged]}:c));setPendingTerms([]);setAdGroupDraft({});setShowAdGroupMap(false);setTab("table");};

  const runAIScore=async(singleTerm=null)=>{
    const toScore=singleTerm?[singleTerm]:terms.filter(t=>t.bucket==="Unassigned");
    if(!toScore.length){setScoreError("No Unassigned terms to score.");return;}
    if(singleTerm) setScoringTermId(singleTerm.id);
    else{setScoring(true);setScoreError("");setScoreProgress({done:0,total:toScore.length});}
    const preScreened={};const needsAI=[];
    toScore.forEach(t=>{const r=preScreen(t.term,activeClient.noFreeConsult,t.practiceArea);if(r) preScreened[t.id]=r;else needsAI.push(t);});
    const byFocus={};needsAI.forEach(t=>{const key=`${t.practiceArea}||${t.practiceFocus||"General"}`;if(!byFocus[key]) byFocus[key]=[];byFocus[key].push(t);});
    const results={};Object.keys(preScreened).forEach(id=>results[id]={bucket:preScreened[id],confidence:"High",reason:"Matched global blocklist"});
    try{
      for(const[focusKey,focusTerms] of Object.entries(byFocus)){const[area,focus]=focusKey.split("||");const chunks=[];for(let i=0;i<focusTerms.length;i+=CHUNK_SIZE) chunks.push(focusTerms.slice(i,i+CHUNK_SIZE));for(const chunk of chunks){const scored=await scoreChunk(chunk,area,focus,activeClient.name,activeClient.targetCPA,activeClient.serviceArea);chunk.forEach((t,i)=>{results[t.id]=scored[i]||{bucket:"Potential - Low Signal",confidence:"Low",reason:"No result returned"};});if(!singleTerm) setScoreProgress({done:Object.keys(results).length,total:toScore.length});}}
      setTerms(prev=>prev.map(t=>{if(!results[t.id]) return t;const{bucket:rawBucket,confidence,reason}=results[t.id];const bucket=applyPostScoreLogic(t,rawBucket,activeClient);const flagPushExact=bucket==="Winner"?true:t.flagPushExact;return{...t,bucket,confidence,scoreReason:reason,flagPushExact};}));
    }catch(e){setScoreError("Scoring failed. Check your connection and try again.");}
    if(singleTerm) setScoringTermId(null);else setScoring(false);
  };

  const toggleSelect=(id)=>setSelected(prev=>{const s=new Set(prev);s.has(id)?s.delete(id):s.add(id);return s;});
  const campaigns=useMemo(()=>["All",...new Set(terms.map(t=>t.campaign).filter(Boolean).sort())],[terms]);
  const adGroups=useMemo(()=>{let t=[...terms];if(filterCampaign!=="All") t=t.filter(x=>x.campaign===filterCampaign);return["All",...new Set(t.map(x=>x.adGroup).filter(Boolean).sort())];});
  const availableFocuses=useMemo(()=>filterArea==="All"?[]:PRACTICE_TAXONOMY[filterArea]||[],[filterArea]);
  const filtered=useMemo(()=>{let r=[...terms];if(filterBucket!=="All") r=r.filter(t=>t.bucket===filterBucket);if(filterArea!=="All") r=r.filter(t=>t.practiceArea===filterArea);if(filterFocus!=="All") r=r.filter(t=>t.practiceFocus===filterFocus);if(filterCampaign!=="All") r=r.filter(t=>t.campaign===filterCampaign);if(filterAdGroup!=="All") r=r.filter(t=>t.adGroup===filterAdGroup);if(filterSearch) r=r.filter(t=>t.term.toLowerCase().includes(filterSearch.toLowerCase()));r.sort((a,b)=>{let av=a[sortCol]??"",bv=b[sortCol]??"";const an=parseFloat(String(av).replace(/[$,%x]/g,"")),bn=parseFloat(String(bv).replace(/[$,%x]/g,""));if(!isNaN(an)&&!isNaN(bn)) return sortDir==="asc"?an-bn:bn-an;return sortDir==="asc"?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));});return r;},[terms,filterBucket,filterArea,filterFocus,filterCampaign,filterAdGroup,filterSearch,sortCol,sortDir]);
  const exportGroups=useMemo(()=>{let r=terms.filter(t=>exportBuckets.includes(t.bucket));if(exportCampaign!=="All") r=r.filter(t=>t.campaign===exportCampaign);const groups={};r.forEach(t=>{const key=exportGroupBy==="campaign"?(t.campaign||"No Campaign"):`${t.campaign||"No Campaign"} > ${t.adGroup||"No Ad Group"}`;if(!groups[key]) groups[key]=[];groups[key].push(t);});return groups;},[terms,exportBuckets,exportCampaign,exportGroupBy]);
  const exportText=useMemo(()=>Object.entries(exportGroups).map(([g,ts])=>`# ${g}\n${ts.map(t=>formatKw(t.term,exportMatchType)).join("\n")}`).join("\n\n"),[exportGroups,exportMatchType]);
  const buildCSV=(termList)=>{const headers=["Search Term","Campaign","Ad Group","Bucket","Practice Area","Practice Focus","Clicks","Impressions","Cost","Conversions","CTR","CPA","ROAS","Confidence","Score Reason","Bid Up","Push to Exact","Clone"];const rows=termList.map(t=>[`"${t.term}"`,`"${t.campaign||""}"`,`"${t.adGroup||""}"`,`"${t.bucket}"`,`"${t.practiceArea||""}"`,`"${t.practiceFocus||""}"`,t.clicks||"",t.impressions||"",t.cost||"",t.conversions||"",t.ctr||"",t.cpa||"",t.roas||"",`"${t.confidence||""}"`,`"${t.scoreReason||""}"`,t.flagBidUp?"Yes":"No",t.flagPushExact?"Yes":"No",t.flagClone?"Yes":"No"].join(","));return[headers.join(","),...rows].join("\n");};
  const downloadFile=(content,filename)=>{const encoded="data:text/csv;charset=utf-8,"+encodeURIComponent(content);const a=document.createElement("a");a.href=encoded;a.download=filename;a.click();};
  const sortHeader=(col)=>{if(sortCol===col) setSortDir(d=>d==="asc"?"desc":"asc");else{setSortCol(col);setSortDir("asc");}};
  const colHead=(col,label)=>(<th key={col} onClick={()=>sortHeader(col)} className="px-2 py-2 text-left text-xs font-semibold text-gray-400 cursor-pointer hover:text-white whitespace-nowrap select-none">{label}{sortCol===col?(sortDir==="asc"?" ↑":" ↓"):""}</th>);
  const bucketCounts=useMemo(()=>{const c={};BUCKETS.forEach(b=>c[b]=0);terms.forEach(t=>{if(c[t.bucket]!==undefined)c[t.bucket]++;});return c;},[terms]);
  const unassignedCount=terms.filter(t=>t.bucket==="Unassigned").length;

        </div>)}

        {tab==="import"&&(<div className="max-w-3xl"><h2 className="text-base font-semibold mb-1">Import into <span className="text-indigo-400">{activeClient.name}</span></h2>{activeClient.serviceArea?<p className="text-sm text-gray-400 mb-1">Service area: <span className="text-emerald-400">{activeClient.serviceArea}</span>. Geographic Mismatch scoring is active.</p>:<p className="text-sm text-yellow-500 mb-1">No service area set. Geographic Mismatch scoring is off.</p>}<p className="text-sm text-gray-400 mb-4">Paste tab-separated data, then map each ad group to a practice focus.</p><textarea value={pasteRaw} onChange={e=>setPasteRaw(e.target.value)} rows={12} placeholder="Paste tab-separated data here (with header row)..." className="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-sm text-white font-mono placeholder-gray-600 resize-y"/>{pasteError&&<p className="text-red-400 text-sm mt-2">{pasteError}</p>}<div className="flex gap-3 mt-3"><button onClick={handlePaste} className="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded font-medium">Next: Map Ad Groups</button><button onClick={()=>{setPasteRaw("");setPasteError("");}} className="bg-gray-700 hover:bg-gray-600 text-white text-sm px-4 py-2 rounded">Clear</button></div></div>)}

        {tab==="export"&&(<div className="max-w-2xl"><h2 className="text-base font-semibold mb-4">Export from <span className="text-indigo-400">{activeClient.name}</span></h2><div className="flex flex-wrap gap-3 mb-4"><div><label className="text-xs text-gray-400 block mb-1">Buckets to Export</label><div className="flex flex-wrap gap-1">{BUCKETS.filter(b=>b!=="Unassigned").map(b=>(<button key={b} onClick={()=>setExportBuckets(prev=>prev.includes(b)?prev.filter(x=>x!==b):[...prev,b])} className={`text-xs px-2 py-1 rounded border transition-colors ${exportBuckets.includes(b)?BUCKET_COLORS[b]:"bg-gray-800 border-gray-700 text-gray-400 hover:text-white"}`}>{b}</button>))}</div></div><div className="flex gap-3 flex-wrap"><div><label className="text-xs text-gray-400 block mb-1">Group By</label><select value={exportGroupBy} onChange={e=>setExportGroupBy(e.target.value)} className="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm text-white"><option value="adGroup">Campaign + Ad Group</option><option value="campaign">Campaign Only</option></select></div><div><label className="text-xs text-gray-400 block mb-1">Filter Campaign</label><select value={exportCampaign} onChange={e=>setExportCampaign(e.target.value)} className="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm text-white max-w-[180px]">{exportCampaigns.map(c=><option key={c}>{c}</option>)}</select></div><div><label className="text-xs text-gray-400 block mb-1">Match Type</label><select value={exportMatchType} onChange={e=>setExportMatchType(e.target.value)} className="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm text-white"><option>Exact</option><option>Phrase</option><option>Broad</option></select></div></div></div><div className="bg-gray-800 border border-gray-700 rounded-lg p-4 mb-3"><div className="flex justify-between items-center mb-3"><span className="text-xs text-gray-400">{Object.values(exportGroups).flat().length} terms across {Object.keys(exportGroups).length} groups</span><div className="flex gap-2"><button onClick={()=>{navigator.clipboard.writeText(exportText);setCopied(true);setTimeout(()=>setCopied(false),2000);}} className={`text-xs px-3 py-1 rounded font-medium transition-colors ${copied?"bg-emerald-700 text-emerald-200":"bg-gray-700 hover:bg-gray-600 text-white"}`}>{copied?"Copied!":"Copy"}</button><button onClick={()=>downloadFile(exportText,`${activeClient.name.replace(/\s+/g,"-")}-export.txt`)} className="text-xs px-3 py-1 rounded font-medium bg-gray-700 hover:bg-gray-600 text-white">.txt</button><button onClick={()=>downloadFile(buildCSV(Object.values(exportGroups).flat()),`${activeClient.name.replace(/\s+/g,"-")}-export.csv`)} className="text-xs px-3 py-1 rounded font-medium bg-emerald-700 hover:bg-emerald-600 text-white">.csv</button></div></div>{Object.keys(exportGroups).length===0?(<p className="text-xs text-gray-500">No terms match this selection.</p>):(<div className="space-y-4 max-h-96 overflow-y-auto">{Object.entries(exportGroups).map(([group,ts])=>(<div key={group}><p className="text-xs font-semibold text-indigo-400 mb-1">{group}</p><pre className="text-xs text-gray-300 font-mono whitespace-pre-wrap">{ts.map(t=>formatKw(t.term,exportMatchType)).join("\n")}</pre></div>))}</div>)}</div></div>)}

        {tab==="settings"&&(<div className="max-w-lg"><h2 className="text-base font-semibold mb-4">Settings</h2><div className="bg-gray-800 border border-gray-700 rounded-lg px-4 py-4 mb-4 space-y-3"><p className="text-xs font-semibold text-gray-400">BUCKET DEFINITIONS</p>{BUCKETS.filter(b=>b!=="Unassigned").map(b=>(<div key={b} className="flex gap-2"><span className={`text-xs px-2 py-0.5 rounded border whitespace-nowrap self-start ${BUCKET_COLORS[b]}`}>{b}</span><p className="text-xs text-gray-400">{BUCKET_DESC[b]}</p></div>))}</div></div>)}
      </div>
    </div>
  );
}

// ── mount ──────────────────────────────────────────────────────────────────
document.getElementById('loading').style.display = 'none';
document.getElementById('root').style.display = 'block';
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
